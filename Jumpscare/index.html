<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallo Haunted House</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Creepster', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1a0926 0%, #050208 100%);
      color: #f0f0f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .fog {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(138, 43, 226, 0.03);
      pointer-events: none;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 3.5rem;
      color: #ff5722;
      text-shadow: 0 0 20px rgba(255, 87, 34, 0.7), 0 0 40px rgba(138, 43, 226, 0.5);
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #b19cd9;
      font-size: 1.2rem;
      margin-top: 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .room-box {
      background: rgba(20, 10, 30, 0.9);
      border: 2px solid #8a2be2;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.4);
      margin-bottom: 30px;
    }

    .btn {
      background: linear-gradient(135deg, #ff5722, #c0392b);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.5);
      transition: transform 0.2s, background 0.2s;
      margin: 10px;
    }

    .btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #ff784e, #d9534f);
    }

    .secret-btn-container {
      margin-top: 25px;
    }

    #secret-jumpscare-btn {
      background: transparent;
      border: 1px dashed rgba(138, 43, 226, 0.3);
      color: #6a4c93;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    #secret-jumpscare-btn:hover {
      color: #ff5722;
      border-color: #ff5722;
      background: rgba(255, 87, 34, 0.05);
    }

    .jumpscare-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.01s ease-in-out;
    }

    .jumpscare-overlay.active {
      opacity: 1;
      pointer-events: auto;
      animation: shake 0.03s infinite;
    }

    .jumpscare-image {
      max-width: 85vw;
      max-height: 70vh;
      border-radius: 8px;
      filter: drop-shadow(0 0 50px #ff0000);
      animation: pulse-face 0.06s infinite alternate;
    }

    @keyframes shake {
      0% { transform: translate(18px, 18px) rotate(0deg); }
      25% { transform: translate(-18px, -20px) rotate(-5deg); }
      50% { transform: translate(-12px, 18px) rotate(5deg); }
      75% { transform: translate(15px, -15px) rotate(3deg); }
      100% { transform: translate(-18px, 18px) rotate(-3deg); }
    }

    @keyframes pulse-face {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <div class="fog"></div>

  <header>
    <h1>Hallo Haunted House</h1>
    <p class="subtitle">Step inside... if you dare.</p>
  </header>

  <div class="container">
    <div class="room-box">
      <h2>The Foyer</h2>
      <p style="color: #ccc; margin: 15px 0;">The air grows cold. Shadows dance along the walls. Choose your next move carefully.</p>
      <button class="btn" id="explore-btn">Inspect the Hallway</button>
      
      <div class="secret-btn-container">
        <button id="secret-jumpscare-btn">❓ Don't click this button</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Jumpscare Overlay loading your exact image -->
  <div class="jumpscare-overlay" id="jumpscare-screen">
    <img src="image_8b6311.png" class="jumpscare-image" alt="Scary Jumpscare">
  </div>

  <!-- Audio element pointing to your scream audio file -->
  <audio id="scream-audio" preload="auto">
    <source src="scream.mp3" type="audio/mpeg">
  </audio>

  <script>
    const secretBtn = document.getElementById('secret-jumpscare-btn');
    const jumpscareScreen = document.getElementById('jumpscare-screen');
    const screamAudio = document.getElementById('scream-audio');

    secretBtn.addEventListener('click', () => {
      // Play the local scream audio file
      screamAudio.currentTime = 0;
      screamAudio.volume = 1.0;
      screamAudio.play().catch(e => console.log("Audio playback blocked by browser:", e));

      // Trigger the violent screen shake and show the image
      jumpscareScreen.classList.add('active');

      // Hide after 2 seconds
      setTimeout(() => {
        jumpscareScreen.classList.remove('active');
        screamAudio.pause();
      }, 2000);
    });

    document.getElementById('explore-btn').addEventListener('click', () => {
      alert("You hear footsteps creeping up right behind you...");
    });
  </script>
</body>
</html>
